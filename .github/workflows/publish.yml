name: Publish to npm

# 发布 GitHub Release（tag 形如 v0.1.1）即触发；通过 npm Trusted Publishing（OIDC）发布，无需 NPM_TOKEN。
on:
  release:
    types: [published]

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      # Trusted Publishing 需要 npm >= 11.5.1
      - run: npm install -g npm@latest

      - name: Check tag matches package.json version
        run: |
          v="$(node -p 'require("./package.json").version')"
          [ "${GITHUB_REF_NAME}" = "v${v}" ] || { echo "tag ${GITHUB_REF_NAME} != v${v}"; exit 1; }

      # npm ci 会触发 prepare 完成构建
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

      - run: npm publish
